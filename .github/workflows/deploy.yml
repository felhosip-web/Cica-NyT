name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Wake up OnRender Server
        if: always()
        run: |
          echo "🚀 OnRender szerver felébresztése és frissítés ellenőrzése..."
          RENDER_URL="${{ secrets.RENDER_SERVER_URL }}"
          if [ -z "$RENDER_URL" ]; then
            echo "⚠️ RENDER_SERVER_URL GitHub secret nincs beállítva. Próbálkozás teszteléssel..."
          else
            echo "Pingelés: $RENDER_URL"
            for i in {1..12}; do
              HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$RENDER_URL/version.json" || echo "000")
              echo "Próbálkozás $i/12 - Válasz kód: $HTTP_STATUS"
              if [ "$HTTP_STATUS" -eq "200" ]; then
                echo "✅ OnRender szerver sikeresen felébredt és elérhető!"
                break
              fi
              sleep 5
            done
          fi
