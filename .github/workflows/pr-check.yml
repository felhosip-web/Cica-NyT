name: PR Check & Lighthouse Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-audit:
    name: Build & Lighthouse Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Audit with Lighthouse
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://felhosip-web.github.io/Cica-NyT/
          uploadTargets: temporary-public-storage
          runs: 1

      - name: Comment Lighthouse audit results on PR
        uses: actions/github-script@v7
        if: always() && steps.lighthouse.outcome != 'skipped'
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const manifestPath = path.join(process.cwd(), '.lighthouseci', 'manifest.json');
            let commentBody = '';

            let links = {};
            try {
              const linksRaw = `${{ steps.lighthouse.outputs.links }}`;
              if (linksRaw) {
                links = JSON.parse(linksRaw);
              }
            } catch (e) {
              console.log('Error parsing links output:', e);
            }

            if (fs.existsSync(manifestPath)) {
              try {
                const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));

                commentBody += '### ⚡ Lighthouse Audit Eredmények\n\n';
                commentBody += '| Cél URL | Performance | Accessibility | Best Practices | SEO | PWA | Riport |\n';
                commentBody += '| :--- | :---: | :---: | :---: | :---: | :---: | :---: |\n';

                for (const result of manifest) {
                  const summary = result.summary || {};
                  const formatScore = (score) => {
                    if (score === undefined || score === null) return 'N/A';
                    const pct = Math.round(score * 100);
                    let icon = '🔴';
                    if (pct >= 90) icon = '🟢';
                    else if (pct >= 50) icon = '🟠';
                    return `${icon} ${pct}%`;
                  };

                  const targetUrl = result.url;
                  const perf = formatScore(summary.performance);
                  const a11y = formatScore(summary.accessibility);
                  const best = formatScore(summary['best-practices']);
                  const seo = formatScore(summary.seo);
                  const pwa = formatScore(summary.pwa);
                  const reportUrl = links[targetUrl] ? `[Megtekintés](${links[targetUrl]})` : 'N/A';

                  commentBody += `| ${targetUrl} | ${perf} | ${a11y} | ${best} | ${seo} | ${pwa} | ${reportUrl} |\n`;
                }
              } catch (err) {
                commentBody += '⚠️ Hiba történt a Lighthouse manifest fájl feldolgozásakor.\n';
              }
            } else {
              commentBody += '⚠️ Lighthouse mérés nem tudott lefutni vagy nem keletkezett eredmény.\n';
            }

            const header = '<!-- lighthouse-ci-pr-comment -->';
            const fullBody = `${header}\n${commentBody}\n\n*A mérés a hivatalos GitHub Pages URL-en (https://felhosip-web.github.io/Cica-NyT/) lett elvégezve.*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(header));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullBody,
              });
            }
