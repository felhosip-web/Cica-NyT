name: PR Check & Lighthouse Audit

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-audit:
    name: Build & Lighthouse Comparison
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint (if configured)
        run: |
          if npm run | grep -q "^  lint$"; then
            npm run lint
          else
            echo "No lint script found in package.json, skipping."
          fi

      - name: Build project
        run: npm run build

      - name: Bundle size check
        run: |
          SIZE=$(du -sk dist 2>/dev/null | cut -f1 || echo 0)
          echo "Bundle size: ${SIZE}KB"
          if [ "$SIZE" -gt 5120 ]; then
            echo "::warning::Bundle larger than 5MB (${SIZE}KB)"
          fi

      - name: Start preview server
        run: |
          npm run start > /dev/null 2>&1 &
          echo $! > server.pid
          echo "Waiting for http://localhost:3000/..."
          for i in {1..30}; do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "Preview server is up and running!"
              break
            fi
            sleep 1
          done

      - name: Run Lighthouse PR comparison script
        run: node scripts/lighthouse-pr-compare.js

      - name: Stop preview server
        if: always()
        run: |
          if [ -f server.pid ]; then
            kill $(cat server.pid) 2>/dev/null || true
            rm server.pid
          fi

      - name: Post or update Lighthouse comment on PR
        uses: actions/github-script@v7
        if: always() && hashFiles('lighthouse-comment.md') != ''
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const commentFile = path.join(process.cwd(), 'lighthouse-comment.md');
            if (!fs.existsSync(commentFile)) {
              console.log('No lighthouse-comment.md file found.');
              return;
            }

            const commentContent = fs.readFileSync(commentFile, 'utf8');
            const marker = '<!-- lighthouse-report -->';
            const fullBody = `${marker}\n${commentContent}`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const existingComment = comments.find(c => c.body && c.body.includes(marker));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: fullBody,
              });
              console.log(`Updated comment ID: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: fullBody,
              });
              console.log('Created new PR comment.');
            }
